<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lambda DC Ops Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icons/logo.svg" alt="" width="28" height="28">
      <div>
        <div class="title"><span class="brand-name">Lambda</span> DC Ops Assistant</div>
        <div id="issueKey" class="muted">No issue</div>
      </div>
    </div>
    <div class="actions">
      <button id="analyzeBtn" class="primary" disabled>Analyze</button>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings"></button>
    </div>
    <div id="progress" class="progress hidden" aria-live="polite"></div>
    <nav id="jump" class="jump hidden" aria-label="Jump to section"></nav>
  </header>

  <div id="status" class="status hidden" role="alert"></div>

  <main id="result" class="hidden"></main>

  <div id="footer" class="footer hidden">
    <button id="copyBtn">📋 Copy as Jira comment</button>
    <span id="meta" class="muted"></span>
  </div>

  <section id="chat" class="chat hidden">
    <div class="chat-head">
      <span class="label">Ask the AI about this ticket</span>
      <button id="chatClear" class="mini hidden" type="button">Clear</button>
    </div>
    <div id="chatLog" class="chat-log"></div>
    <div id="chatSuggest" class="chips"></div>
  </section>

  <div class="dev-contact muted"></div>

  <!-- Always at the bottom of the panel: ask the AI about the open ticket. -->
  <form id="chatForm" class="chat-bar dock hidden">
    <textarea id="chatInput" rows="1" placeholder="💬 Ask the AI about this ticket…" title="Enter to send, Shift+Enter for a new line"></textarea>
    <button id="chatSend" class="primary" type="submit" title="Send" aria-label="Send"></button>
  </form>

  <script src="icons.js"></script>
  <script src="common.js"></script>
  <script src="analysis.js"></script>
  <script src="ping.js"></script>
  <script src="netbox.js"></script>
  <script src="privacy.js"></script>
  <script src="bmc.js"></script>
  <script src="catalog.js"></script>
  <script src="slack.js"></script>
  <script src="render.js"></script>
  <script src="sidepanel.js"></script>
  <script src="chat.js"></script>
</body>
</html>
